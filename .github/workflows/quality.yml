name: Quality Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  guardrail:
    name: AGENTS.md Protected Paths Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Protected Paths Violation
        run: |
          if [ "${{ github.head_ref }}" = "stage" ]; then
            echo "ℹ️ Bypassing protected paths guard for stage branch promotion PR."
            exit 0
          fi
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Inspecting changed files against AGENTS.md protected paths..."
          if echo "$CHANGED_FILES" | grep -E '^(\.github/workflows/|\.husky/|\.env|\.env\.|server/src/shared/db/migrations/)'; then
            echo "❌ ERROR: PR modifies protected path(s) prohibited by AGENTS.md Section 9!"
            exit 1
          fi
          echo "✅ No protected paths modified."

  gates:
    name: Gates (${{ matrix.workspace }})
    needs: [guardrail]
    if: always() && (needs.guardrail.result == 'success' || needs.guardrail.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: server
            lint_cmd: npm run lint -w server
            lint_blocking: true
            typecheck_cmd: npm run build -w server
            test_cmd: npm test -w server
          - workspace: client
            lint_cmd: npm run lint -w client
            lint_blocking: true
            typecheck_cmd: npx tsc -b client
            test_cmd: npm run test:run -w client
          - workspace: packages/errors
            lint_cmd: ""
            lint_blocking: true
            typecheck_cmd: npm run build -w packages/errors
            test_cmd: npm test -w packages/errors

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Shared Packages
        if: matrix.workspace != 'packages/errors'
        run: npm run build:packages

      - name: Lint
        if: matrix.lint_cmd != ''
        continue-on-error: ${{ !matrix.lint_blocking }}
        run: ${{ matrix.lint_cmd }}

      - name: Typecheck & Build
        run: ${{ matrix.typecheck_cmd }}

      - name: Unit Tests
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: ${{ matrix.test_cmd }}
