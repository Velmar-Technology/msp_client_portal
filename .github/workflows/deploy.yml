name: Release & Deploy

# Enterprise CD pipeline:
#   prepare -> quality gates -> build & push (parallel) -> vulnerability scan
#           -> GitHub Release (tags only) -> [approval] -> deploy w/ auto-rollback -> notify
#
# Required repository secrets:
#   VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_PORT   - Production VPS SSH access (health checks)
#   PORTAINER_URL                                  - Portainer base URL (e.g. https://host:9443)
#   PORTAINER_API_KEY                              - Portainer API key (X-API-Key)
#   PORTAINER_ENDPOINT_ID / PORTAINER_STACK_ID     - Target environment & stack IDs
#   VITE_GOOGLE_CLIENT_ID or GOOGLE_CLIENT_ID      - Google OAuth client ID (Vite build arg)
#   VITE_PAYPAL_CLIENT_ID                          - PayPal client ID (Vite build arg)
#   VITE_FARO_URL                                  - Grafana Faro RUM collector URL (e.g. https://host/collect)
#   VITE_FARO_APP_NAME                             - Optional Faro app name (defaults to msp-client-portal)
#   VITE_FARO_APP_ENV                              - Optional Faro environment (defaults to production)
#   DEPLOY_WEBHOOK_URL                             - Optional Slack/Discord/Teams notification webhook
#
# Deployment model: Portainer owns the stack lifecycle. CI pushes images to
# GHCR, then updates the stack via the Portainer API with the repo-owned
# docker-compose.prod.yml and a pinned VERSION env var, and finally gates on an
# SSH health check (auto-rollback re-pins the previous VERSION on failure).
# GHCR pull credentials must exist once on the VPS: `docker login ghcr.io` with
# a read:packages PAT, or configure the registry under Portainer → Registries.
# TLS: Portainer's self-signed certificate is currently trusted blindly via
# PORTAINER_TLS_INSECURE=true in deploy-production — remove once CA-signed.
#
# Required repository configuration (Settings):
#   1. Environment "production" with required reviewers for manual approval.
#   2. Branch protection on main requiring the "CI / Quality Gates" checks.
#
# Security gate override (use sparingly — changes are recorded in the audit log):
#   - Manual runs: set the "skipSecurityGate" input to true. Trivy still scans and
#     uploads SARIF artifacts, but HIGH/CRITICAL CVEs won't block release/deploy.
#   - Tag pushes: create a repository variable DISABLE_SECURITY_GATE=true
#     (Settings → Secrets and variables → Actions → Variables), re-run the failed
#     run, then flip it back to false. Works retroactively on existing tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version to deploy (e.g. 1.7.0 or v1.7.0). Defaults to client/package.json version."
        required: false
        default: ""
        type: string
      skipSecurityGate:
        description: "Report-only security scan — HIGH/CRITICAL CVEs won't block release/deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: msp-services-server
  CLIENT_IMAGE: msp-services-client
  MCP_IMAGE: msp-mcp-server

jobs:
  # ------------------------------------------------------------------
  # 1. Prepare — resolve release version and image namespace once
  # ------------------------------------------------------------------
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Resolve Version & Image Namespace
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.releaseVersion }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC="${REPO_OWNER,,}"

          # Strip any leading 'v' or 'V' (e.g., 'v1.7.0' -> '1.7.0')
          RAW_INPUT="${INPUT_VERSION#[vV]}"

          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#[vV]}"
            IS_TAG=true
            IS_RELEASE=true
          elif [ -n "${RAW_INPUT}" ]; then
            VERSION="${RAW_INPUT}"
            IS_TAG=false
            IS_RELEASE=true
          else
            VERSION="$(node -p "require('./client/package.json').version")"
            IS_TAG=false
            IS_RELEASE=true
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid release version '${VERSION}' — expected semver like 1.2.3 or v1.2.3"
            exit 1
          fi

          TAG_NAME="v${VERSION}"

          {
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "owner_lc=${OWNER_LC}"
            echo "is_tag=${IS_TAG}"
            echo "is_release=${IS_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Release ${TAG_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Release Tag | \`${TAG_NAME}\` |"
            echo "| Image namespace | \`${OWNER_LC}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Trigger | \`${REF_TYPE}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ------------------------------------------------------------------
  # 2. Quality gates — lint, typecheck & tests must pass before any image ships
  # ------------------------------------------------------------------
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # ------------------------------------------------------------------
  # 3a. Build & push server image
  # ------------------------------------------------------------------
  build-server:
    name: Build & Push Server
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build & Push Server Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-server
          cache-to: type=gha,mode=max,scope=build-server

  # ------------------------------------------------------------------
  # 3b. Build & push client image (Vite build args baked at compile time)
  # ------------------------------------------------------------------
  build-client:
    name: Build & Push Client
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.CLIENT_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build & Push Client Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
            VITE_APP_VERSION=${{ needs.prepare.outputs.version }}
            VITE_PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}
            VITE_FARO_URL=${{ secrets.VITE_FARO_URL }}
            VITE_FARO_APP_NAME=${{ secrets.VITE_FARO_APP_NAME || 'msp-client-portal' }}
            VITE_FARO_APP_ENV=${{ secrets.VITE_FARO_APP_ENV || 'production' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-client
          cache-to: type=gha,mode=max,scope=build-client

  # ------------------------------------------------------------------
  # 3c. Build & push MCP server image
  # ------------------------------------------------------------------
  build-mcp:
    name: Build & Push MCP Server
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.MCP_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build & Push MCP Server Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-mcp
          cache-to: type=gha,mode=max,scope=build-mcp

  # ------------------------------------------------------------------
  # 4. Security gate — block release on HIGH/CRITICAL CVEs + publish SARIF
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan (${{ matrix.image }})
    needs: [prepare, build-server, build-client, build-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # Bypass switch: manual dispatch input OR repository variable kill-switch
      # (Settings → Secrets and variables → Actions → Variables). The variable is
      # honored at runtime even when re-running old tag pushes.
      SECURITY_GATE_BYPASSED: ${{ inputs.skipSecurityGate == true || vars.DISABLE_SECURITY_GATE == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: msp-services-server
            digest: ${{ needs.build-server.outputs.digest }}
            sarif: trivy-server.sarif
          - image: msp-services-client
            digest: ${{ needs.build-client.outputs.digest }}
            sarif: trivy-client.sarif
          - image: msp-mcp-server
            digest: ${{ needs.build-mcp.outputs.digest }}
            sarif: trivy-mcp.sarif
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Vulnerability Scan (HIGH/CRITICAL blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ matrix.image }}@${{ matrix.digest }}
          trivy-config: .trivy.yaml
          format: sarif
          output: ${{ matrix.sarif }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: ${{ env.SECURITY_GATE_BYPASSED == 'true' && '0' || '1' }}
          ignore-unfixed: true

      - name: Record Gate Status
        if: always()
        run: |
          if [ "${SECURITY_GATE_BYPASSED}" = "true" ]; then
            echo "::warning::Security gate BYPASSED for this run — findings are report-only."
            echo "> Security gate bypassed — HIGH/CRITICAL findings did not block this release." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Security gate enforced (HIGH/CRITICAL blocking)."
          fi

      - name: Upload Scan Results as Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-sarif-${{ matrix.image }}
          path: ${{ matrix.sarif }}
          retention-days: 30

  # ------------------------------------------------------------------
  # 5a. Build Cross-Platform Agent Binaries (Windows & macOS)
  #     Targets: Windows x64, Windows x32, macOS Apple Silicon, macOS Intel
  # ------------------------------------------------------------------
  build-agent-binaries:
    name: Build Agent (${{ matrix.platform }})
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, quality-gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary_name: msp-agent.exe
          - os: windows-latest
            platform: windows-x86
            target: i686-pc-windows-msvc
            binary_name: msp-agent.exe
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
            binary_name: msp-agent
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            binary_name: msp-agent
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --manifest-path packages/msp-agent/Cargo.toml --target ${{ matrix.target }}

      - name: Package Release Assets & Signatures
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          mkdir -p dist-bin
          SRC_BIN="packages/msp-agent/target/${TARGET}/release/${BINARY_NAME}"

          if [ "${PLATFORM}" = "windows-x64" ]; then
            cp "${SRC_BIN}" "dist-bin/msp-agent-${VERSION}-windows-x86_64.exe"
          elif [ "${PLATFORM}" = "windows-x86" ]; then
            cp "${SRC_BIN}" "dist-bin/msp-agent-${VERSION}-windows-i686.exe"
          elif [ "${PLATFORM}" = "macos-aarch64" ]; then
            DMG_DIR="dmg_staging_aarch64"
            mkdir -p "${DMG_DIR}"
            cp "${SRC_BIN}" "${DMG_DIR}/msp-agent"
            chmod +x "${DMG_DIR}/msp-agent"
            hdiutil create -volname "MSPEndpointAgent" -srcfolder "${DMG_DIR}" -ov -format UDZO "dist-bin/msp-agent-${VERSION}-macos-aarch64.dmg"
          elif [ "${PLATFORM}" = "macos-x86_64" ]; then
            DMG_DIR="dmg_staging_x64"
            mkdir -p "${DMG_DIR}"
            cp "${SRC_BIN}" "${DMG_DIR}/msp-agent"
            chmod +x "${DMG_DIR}/msp-agent"
            hdiutil create -volname "MSPEndpointAgent" -srcfolder "${DMG_DIR}" -ov -format UDZO "dist-bin/msp-agent-${VERSION}-macos-x64.dmg"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-bin-${{ matrix.platform }}
          path: dist-bin/*
          retention-days: 5

  # ------------------------------------------------------------------
  # 5b. Build Cross-Platform Desktop Tray Binaries (Windows x64 / x86)
  # ------------------------------------------------------------------
  build-tray-binaries:
    name: Build Tray (${{ matrix.platform }})
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, quality-gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary_name: msp-tray.exe
          - os: windows-latest
            platform: windows-x86
            target: i686-pc-windows-msvc
            binary_name: msp-tray.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Build Tray Frontend Assets
        run: npm --prefix packages/msp-tray run build

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tray Release Binary
        run: cargo build --release --manifest-path packages/msp-tray/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Package Tray Assets & Signatures
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          mkdir -p dist-bin
          SRC_BIN="packages/msp-tray/src-tauri/target/${TARGET}/release/${BINARY_NAME}"

          if [ "${PLATFORM}" = "windows-x64" ]; then
            cp "${SRC_BIN}" "dist-bin/msp-tray-${VERSION}-windows-x86_64.exe"
          elif [ "${PLATFORM}" = "windows-x86" ]; then
            cp "${SRC_BIN}" "dist-bin/msp-tray-${VERSION}-windows-i686.exe"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tray-bin-${{ matrix.platform }}
          path: dist-bin/*
          retention-days: 5

  # ------------------------------------------------------------------
  # 5c. GitHub Release — generated notes & compiled agent/tray binaries
  # ------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build-agent-binaries, build-tray-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Download All Binaries
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: "*-bin-*"
          path: downloaded-artifacts/
          merge-multiple: true

      - name: Consolidate Artifacts & Compute Checksums
        id: checksums
        run: |
          mkdir -p release-assets
          find downloaded-artifacts/ -type f -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > SHA256SUMS.txt

          echo "### Release Assets & SHA256 Checksums" > ../release-notes-table.md
          echo "" >> ../release-notes-table.md
          echo "| Artifact | SHA256 Checksum |" >> ../release-notes-table.md
          echo "| :--- | :--- |" >> ../release-notes-table.md

          for f in *; do
            if [ "$f" != "SHA256SUMS.txt" ]; then
              HASH=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$f\` | \`sha256:$HASH\` |" >> ../release-notes-table.md
            fi
          done

      - name: Create Release with Agent & Tray Binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Release ${{ needs.prepare.outputs.tag_name }}
          body_path: release-notes-table.md
          generate_release_notes: true
          make_latest: true
          files: release-assets/*

  # ------------------------------------------------------------------
  # 6. Deploy to production — gated by "production" environment approval.
  #    Portainer owns the stack lifecycle: CI pushes the repo compose spec and
  #    a pinned VERSION via the Portainer API, then gates on an SSH health
  #    check with automatic rollback to the previous version on failure.
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (Portainer)
    needs: [prepare, security-scan, build-server, build-client, build-mcp]
    runs-on: ubuntu-latest
    # Budget must cover worst case: PUT (10m) + health check + rollback PUT + re-verify
    timeout-minutes: 25
    environment:
      name: production
      url: https://helpdesk.velmartech.com.do
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
      PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
      # Portainer currently serves a self-signed certificate. Flip to "false"
      # once it sits behind Traefik with a CA-signed cert.
      PORTAINER_TLS_INSECURE: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Capture Rollback Point
        run: |
          set -euo pipefail
          CURL_OPTS=(-sfS --max-time 30)
          if [ "${PORTAINER_TLS_INSECURE}" = "true" ]; then
            CURL_OPTS+=(-k)
          fi
          RESP="$(curl "${CURL_OPTS[@]}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL%/}/api/endpoints/${PORTAINER_ENDPOINT_ID}/docker/containers/msp_server_prod/json" || true)"
          IMG="$(jq -r '.Config.Image // ""' <<<"${RESP}" 2>/dev/null || true)"
          TAG="${IMG##*:}"
          if [ -n "${TAG}" ] && [ "${TAG}" != "${IMG}" ]; then
            echo "PREVIOUS_VERSION=${TAG}" >> "${GITHUB_ENV}"
            echo "Rollback point recorded: ${TAG}"
          else
            echo "PREVIOUS_VERSION=" >> "${GITHUB_ENV}"
            echo "::warning::No running msp_server_prod container found — automatic rollback disabled for this run."
          fi

      - name: Pre-warm Image Pulls on VPS
        # Best-effort: shrinks the synchronous Portainer PUT window by pulling
        # the new app images ahead of time. Requires the one-time GHCR docker
        # login on the VPS; failures are non-fatal (PUT still pulls on its own).
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER_LC: ${{ needs.prepare.outputs.owner_lc }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VERSION,OWNER_LC
          script: |
            for image in msp-services-server msp-services-client msp-mcp-server; do
              if docker pull "ghcr.io/${OWNER_LC}/${image}:${VERSION}"; then
                echo "[prewarm] Pulled ${image}:${VERSION}"
              else
                echo "[prewarm] WARNING: could not pre-pull ${image}:${VERSION} (GHCR login missing?) — Portainer will pull during stack update"
              fi
            done

      - name: Update Stack via Portainer API
        id: deploy
        run: bash scripts/portainer-stack-update.sh "${VERSION}"

      - name: Verify Application Health
        id: health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            SERVER_HEALTHY=false
            for attempt in $(seq 1 12); do
              if docker exec msp_server_prod node -e \
                "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" >/dev/null 2>&1; then
                echo "[health] Server API healthy (attempt ${attempt}/12)"
                SERVER_HEALTHY=true
                break
              fi
              echo "[health] Waiting for API health... (${attempt}/12)"
              sleep 5
            done

            if [ "${SERVER_HEALTHY}" != "true" ]; then
              echo "[health] ERROR: server failed health verification after 12 attempts"
              exit 1
            fi

            for attempt in $(seq 1 12); do
              if docker exec msp_mcp_prod wget -q --spider http://127.0.0.1:3005/health >/dev/null 2>&1; then
                echo "[health] MCP Server healthy (attempt ${attempt}/12)"
                exit 0
              fi
              echo "[health] Waiting for MCP Server health... (${attempt}/12)"
              sleep 5
            done
            echo "[health] WARNING: MCP server container health check timed out"
            exit 0

      - name: Rollback to Previous Version
        if: steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure'
        run: |
          if [ -z "${PREVIOUS_VERSION:-}" ]; then
            echo "::error::Deployment failed and no rollback point exists — manual intervention required."
            exit 1
          fi
          echo "::warning::Deployment failed — rolling back to ${PREVIOUS_VERSION}"
          bash scripts/portainer-stack-update.sh "${PREVIOUS_VERSION}"

      - name: Verify Rollback Health
        if: steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            for attempt in $(seq 1 12); do
              if docker exec msp_server_prod node -e \
                "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" >/dev/null 2>&1; then
                echo "[health] Rollback healthy (attempt ${attempt}/12)"
                exit 0
              fi
              echo "[health] Waiting for rollback health... (${attempt}/12)"
              sleep 5
            done
            echo "[health] ERROR: rollback failed health verification — manual intervention required"
            exit 1

      - name: Write Deployment Summary
        run: |
          {
            echo "### ✅ Deployed to Production"
            echo ""
            echo "| Component | Image | Digest |"
            echo "| --------- | ----- | ------ |"
            echo "| Server | \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.SERVER_IMAGE }}:${{ needs.prepare.outputs.version }}\` | \`${{ needs.build-server.outputs.digest }}\` |"
            echo "| Client | \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.CLIENT_IMAGE }}:${{ needs.prepare.outputs.version }}\` | \`${{ needs.build-client.outputs.digest }}\` |"
            echo "| Rollback point | \`${PREVIOUS_VERSION:-n/a}\` | |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ------------------------------------------------------------------
  # 7. Notify — Slack/Discord/Teams compatible webhook (success & failure)
  # ------------------------------------------------------------------
  notify:
    name: Deployment Notification
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Webhook Notification
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ needs.deploy-production.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::notice::DEPLOY_WEBHOOK_URL secret not configured — skipping notification."
            exit 0
          fi

          if [ "${STATUS}" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          MESSAGE="${EMOJI} MSP Portal **v${VERSION}** deployment ${STATUS} (triggered by ${ACTOR})"

          jq -n --arg text "${MESSAGE} ${RUN_URL}" '{text: $text, content: $text}' > payload.json
          curl -sf --max-time 10 \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${WEBHOOK_URL}" || echo "::warning::Webhook delivery failed — check DEPLOY_WEBHOOK_URL."
