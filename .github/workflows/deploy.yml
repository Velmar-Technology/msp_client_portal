name: Build and Deploy to VPS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version to deploy (e.g. 1.2.0). Defaults to client package.json version."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Release Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.releaseVersion }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.releaseVersion }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(node -p "require('./client/package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Read Client Version
        run: |
          echo "CLIENT_VERSION=$(node -p "require('./client/package.json').version")" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Owner and Repo Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
          echo "REPO_LC=${REPO,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"
          REPO: "${{ github.event.repository.name }}"

      - name: Build & Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/msp-services-server:latest
            ghcr.io/${{ env.OWNER_LC }}/msp-services-server:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/msp-services-server:${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Client Secrets
        run: |
          if [ -n "${SECRET_VAL}" ]; then
            echo "✅ Google Client ID secret found for Vite build."
          else
            echo "⚠️ WARNING: Neither VITE_GOOGLE_CLIENT_ID nor GOOGLE_CLIENT_ID secret was found in GitHub Secrets!"
            echo "Vite frontend will be built in Sandbox mode."
          fi
        env:
          SECRET_VAL: ${{ secrets.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}

      - name: Verify PayPal Client Secret
        run: |
          if [ -n "${PAYPAL_SECRET_VAL}" ]; then
            echo "✅ PayPal client ID secret found for Vite build."
          else
            echo "⚠️ WARNING: VITE_PAYPAL_CLIENT_ID secret was not found in GitHub Secrets!"
            echo "Vite frontend will fall back to the sandbox/test PayPal client ID."
          fi
        env:
          PAYPAL_SECRET_VAL: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
            VITE_APP_VERSION=${{ env.CLIENT_VERSION }}
            VITE_PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/msp-services-client:latest
            ghcr.io/${{ env.OWNER_LC }}/msp-services-client:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/msp-services-client:${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Release Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.releaseVersion }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.releaseVersion }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(node -p "require('./client/package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Downcase Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Copy Docker Compose file to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "~/msp-client-portal"

      - name: Execute Remote SSH Deploy Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to deploy directory
            mkdir -p ~/msp-client-portal
            cd ~/msp-client-portal


            # Log in to GHCR using ephemeral GitHub token passed from the active Action run
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set the repository owner variable for Docker Compose interpolation
            export REPOSITORY_OWNER=${{ env.OWNER_LC }}
            export VERSION=${{ env.RELEASE_VERSION }}

            # Pull latest images from GHCR
            docker compose -f docker-compose.prod.yml pull

            # Run containers in detached mode, recreate updated containers
            docker compose -f docker-compose.prod.yml up -d

            # Log out from GHCR to clean up credentials
            docker logout ghcr.io
