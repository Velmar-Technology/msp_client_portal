name: Release

on:
  workflow_dispatch:
    inputs:
      releaseAs:
        description: "Release type (major, minor, patch)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Bump Version, Changelog & Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run commit-and-tag-version
        run: npx --yes commit-and-tag-version@12.7.3 --release-as "${{ github.event.inputs.releaseAs }}"

      - name: Push release commit and tag
        run: |
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${REPO}.git"
          git push --follow-tags origin HEAD:"${{ github.event.repository.default_branch }}"
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
