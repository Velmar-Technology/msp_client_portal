name: Nightly Build & Publish

# Automated Nightly Pipeline (Option A — Safe Build & Publish):
#   Schedule: 04:00 UTC (00:00 AST) daily
#   Flow: prepare -> quality gates -> build & push (parallel) -> security scan -> notify
#   Note: Publishes validated container images to GHCR without mutating Portainer or production.
#
# Required repository secrets:
#   VITE_GOOGLE_CLIENT_ID or GOOGLE_CLIENT_ID      - Google OAuth client ID (Vite build arg)
#   VITE_PAYPAL_CLIENT_ID                          - PayPal client ID (Vite build arg)
#   VITE_FARO_URL                                  - Grafana Faro RUM collector URL
#   VITE_FARO_APP_NAME                             - Optional Faro app name (defaults to msp-client-portal)
#   DEPLOY_WEBHOOK_URL                             - Optional Slack/Discord/Teams notification webhook

on:
  schedule:
    # Runs at 04:00 UTC (00:00 AST Dominican Republic time) every night
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      skipSecurityGate:
        description: "Report-only security scan — HIGH/CRITICAL CVEs won't block image publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: msp-services-server
  CLIENT_IMAGE: msp-services-client
  MCP_IMAGE: msp-mcp-server

jobs:
  # ------------------------------------------------------------------
  # 1. Prepare — compute nightly version, date tag and image namespace
  # ------------------------------------------------------------------
  prepare:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      date_tag: ${{ steps.meta.outputs.date_tag }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      trigger: ${{ steps.meta.outputs.trigger }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Resolve Nightly Metadata
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OWNER_LC="${REPO_OWNER,,}"
          BASE_VERSION="$(node -p "require('./client/package.json').version")"
          DATE_TAG="$(date +'%Y%m%d')"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${BASE_VERSION}-nightly.${DATE_TAG}.${SHORT_SHA}"

          {
            echo "version=${VERSION}"
            echo "date_tag=${DATE_TAG}"
            echo "owner_lc=${OWNER_LC}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "trigger=${EVENT_NAME}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### 🌙 Nightly Build \`${VERSION}\`"
            echo ""
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| Nightly Version | \`${VERSION}\` |"
            echo "| Base Semver | \`${BASE_VERSION}\` |"
            echo "| Date Tag | \`${DATE_TAG}\` |"
            echo "| Image Namespace | \`${OWNER_LC}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Trigger | \`${EVENT_NAME}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ------------------------------------------------------------------
  # 2. Quality gates — lint, typecheck & tests across all workspaces
  # ------------------------------------------------------------------
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # ------------------------------------------------------------------
  # 3a. Build & push server container image
  # ------------------------------------------------------------------
  build-server:
    name: Build & Push Server
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.date_tag }}
            type=sha,format=long,prefix=

      - name: Build & Push Server Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-server
          cache-to: type=gha,mode=max,scope=build-server

  # ------------------------------------------------------------------
  # 3b. Build & push client container image
  # ------------------------------------------------------------------
  build-client:
    name: Build & Push Client
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.CLIENT_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.date_tag }}
            type=sha,format=long,prefix=

      - name: Build & Push Client Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
            VITE_APP_VERSION=${{ needs.prepare.outputs.version }}
            VITE_PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}
            VITE_FARO_URL=${{ secrets.VITE_FARO_URL }}
            VITE_FARO_APP_NAME=${{ secrets.VITE_FARO_APP_NAME || 'msp-client-portal' }}
            VITE_FARO_APP_ENV=nightly
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-client
          cache-to: type=gha,mode=max,scope=build-client

  # ------------------------------------------------------------------
  # 3c. Build & push MCP server container image
  # ------------------------------------------------------------------
  build-mcp:
    name: Build & Push MCP Server
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.MCP_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.date_tag }}
            type=sha,format=long,prefix=

      - name: Build & Push MCP Server Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-mcp
          cache-to: type=gha,mode=max,scope=build-mcp

  # ------------------------------------------------------------------
  # 4. Security scan — Trivy container vulnerability analysis
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan (${{ matrix.image }})
    needs: [prepare, build-server, build-client, build-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      SECURITY_GATE_BYPASSED: ${{ inputs.skipSecurityGate == true || vars.DISABLE_SECURITY_GATE == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: msp-services-server
            digest: ${{ needs.build-server.outputs.digest }}
            sarif: trivy-server.sarif
          - image: msp-services-client
            digest: ${{ needs.build-client.outputs.digest }}
            sarif: trivy-client.sarif
          - image: msp-mcp-server
            digest: ${{ needs.build-mcp.outputs.digest }}
            sarif: trivy-mcp.sarif
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ matrix.image }}@${{ matrix.digest }}
          trivy-config: .trivy.yaml
          format: sarif
          output: ${{ matrix.sarif }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: ${{ env.SECURITY_GATE_BYPASSED == 'true' && '0' || '1' }}
          ignore-unfixed: true

      - name: Record Gate Status
        if: always()
        run: |
          if [ "${SECURITY_GATE_BYPASSED}" = "true" ]; then
            echo "::warning::Security gate BYPASSED for nightly run — findings are report-only."
            echo "> Security gate bypassed — HIGH/CRITICAL findings did not block nightly publish." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Security gate enforced (HIGH/CRITICAL blocking)."
          fi

      - name: Upload Scan Results as Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-sarif-${{ matrix.image }}
          path: ${{ matrix.sarif }}
          retention-days: 14

  # ------------------------------------------------------------------
  # 5. Notify & Summary — publish image manifest & alert via webhook
  # ------------------------------------------------------------------
  notify:
    name: Nightly Summary & Notification
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, quality-gates, build-server, build-client, build-mcp, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write Nightly Summary
        run: |
          {
            echo "### 🌙 ✅ Nightly Build & Publish Complete"
            echo ""
            echo "| Component | Published Image | Digest |"
            echo "| --------- | --------------- | ------ |"
            echo "| Server | \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.SERVER_IMAGE }}:${{ needs.prepare.outputs.version }}\` | \`${{ needs.build-server.outputs.digest }}\` |"
            echo "| Client | \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.CLIENT_IMAGE }}:${{ needs.prepare.outputs.version }}\` | \`${{ needs.build-client.outputs.digest }}\` |"
            echo "| MCP Server | \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner_lc }}/${{ env.MCP_IMAGE }}:${{ needs.prepare.outputs.version }}\` | \`${{ needs.build-mcp.outputs.digest }}\` |"
            echo ""
            echo "> Images also tagged as \`:nightly\` and \`:nightly-${{ needs.prepare.outputs.date_tag }}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Send Webhook Notification
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          BUILD_STATUS: ${{ (needs.build-server.result == 'success' && needs.build-client.result == 'success' && needs.build-mcp.result == 'success' && needs.security-scan.result == 'success') && 'success' || 'failure' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TRIGGER: ${{ needs.prepare.outputs.trigger }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::notice::DEPLOY_WEBHOOK_URL secret not configured — skipping notification."
            exit 0
          fi

          if [ "${BUILD_STATUS}" = "success" ]; then
            EMOJI="🌙 ✅"
          else
            EMOJI="🌙 ❌"
          fi

          MESSAGE="${EMOJI} MSP Portal Nightly **${VERSION}** publish ${BUILD_STATUS} (trigger: ${TRIGGER})"

          jq -n --arg text "${MESSAGE} ${RUN_URL}" '{text: $text, content: $text}' > payload.json
          curl -sf --max-time 10 \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${WEBHOOK_URL}" || echo "::warning::Webhook delivery failed — check DEPLOY_WEBHOOK_URL."
