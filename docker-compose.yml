version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: msp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: msp_password
      POSTGRES_DB: msp_helpdesk
      TZ: America/Santo_Domingo
      PGTZ: America/Santo_Domingo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: msp_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: msp_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - TZ=${TZ:-America/Santo_Domingo}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-msp_helpdesk}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-msp_dev_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-jwt-secret-do-not-use-in-prod}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-insecure-jwt-refresh-secret-do-not-use-in-prod}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:80,http://localhost:5173,http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - UPLOAD_DIR=/app/server/uploads
      - ZABBIX_URL=${ZABBIX_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      - ZABBIX_USER=${ZABBIX_USER:-Admin}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD:-zabbix}
      - ZABBIX_WEBHOOK_SECRET=${ZABBIX_WEBHOOK_SECRET:-dev_webhook_secret}
    volumes:
      - uploads_data:/app/server/uploads

  zabbix-db:
    image: postgres:16-alpine
    container_name: msp_zabbix_db
    restart: always
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      TZ: America/Santo_Domingo
      PGTZ: America/Santo_Domingo
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_server
    restart: always
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      TZ: America/Santo_Domingo
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_web
    restart: always
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      TZ: America/Santo_Domingo
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      PHP_TZ: "America/Santo_Domingo"

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-6.0-latest
    container_name: msp_zabbix_agent
    restart: always
    network_mode: "service:zabbix-server"
    depends_on:
      - zabbix-server
    environment:
      TZ: America/Santo_Domingo
      ZBX_SERVER_HOST: "127.0.0.1,zabbix-server"
      ZBX_HOSTNAME: "Zabbix server"

  agent:
    build:
      context: packages/msp-agent
      dockerfile: Dockerfile
    container_name: msp_rust_agent
    restart: always
    depends_on:
      - server
    environment:
      - TZ=America/Santo_Domingo
      - RUST_LOG=info
      - MSP_GATEWAY_URL=ws://server:3001/agent-ws
      - MSP_AGENT_ID=00000000-0000-0000-0000-000000000001
      - MSP_AGENT_TOKEN=dev-token

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_PAYPAL_CLIENT_ID: "${VITE_PAYPAL_CLIENT_ID:-}"
        VITE_APP_VERSION: "${VITE_APP_VERSION:-1.3.5}"
    container_name: msp_client
    restart: always
    environment:
      - TZ=America/Santo_Domingo
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
  zabbix_pgdata:
    driver: local
  uploads_data:
    driver: local
  redisdata:
    driver: local


