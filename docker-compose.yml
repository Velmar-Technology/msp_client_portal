version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: msp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: msp_password
      POSTGRES_DB: msp_helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: msp_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=msp_helpdesk
      - DB_USER=postgres
      - DB_PASSWORD=msp_password
      - PORT=3001
      - NODE_ENV=development
      - JWT_SECRET=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_SECRET=u9B+8K3WmxR7YJ2D5PqZ9Xv5C7N2bK9T4mJ8qR1WvY4=
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:80,http://localhost:5173,http://localhost
      - GOOGLE_CLIENT_ID=934502830032-cf8naqt4d2hfi2sf9lmpph1k4ctbm4i2.apps.googleusercontent.com
      - PAYPAL_CLIENT_ID=AW62-DrjJDEz6Mb-_VdAud9ZNI7zntWQN5RbL_peKzMer_eWWLKOnVEiHZpzpoKN4qtxqimlMZzp9-L0
      - PAYPAL_CLIENT_SECRET=EE9sb385hAMSwBHpZpafVZMbcQ8BQ3wVXIGRxx1SiyhFSqYOhRa9Iu3IYAVDRdOhOWo2mBIlW1WFruOH
      - UPLOAD_DIR=/app/server/uploads
      - ZABBIX_URL=http://zabbix-web:8080/api_jsonrpc.php
      - ZABBIX_USER=Admin
      - ZABBIX_PASSWORD=zabbix
      - ZABBIX_WEBHOOK_SECRET=secret_key
    volumes:
      - uploads_data:/app/server/uploads

  zabbix-db:
    image: postgres:16-alpine
    container_name: msp_zabbix_db
    restart: always
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_server
    restart: always
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_web
    restart: always
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      PHP_TZ: "America/Santo_Domingo"

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-6.0-latest
    container_name: msp_zabbix_agent
    restart: always
    network_mode: "service:zabbix-server"
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: "127.0.0.1,zabbix-server"
      ZBX_HOSTNAME: "Zabbix server"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "934502830032-cf8naqt4d2hfi2sf9lmpph1k4ctbm4i2.apps.googleusercontent.com"
        VITE_PAYPAL_CLIENT_ID: "AW62-DrjJDEz6Mb-_VdAud9ZNI7zntWQN5RbL_peKzMer_eWWLKOnVEiHZpzpoKN4qtxqimlMZzp9-L0"
        VITE_APP_VERSION: "1.3.5"
    container_name: msp_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
  zabbix_pgdata:
    driver: local
  uploads_data:
    driver: local


