version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: msp_postgres_db_prod
    restart: always
    networks:
      - default
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-msp_helpdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/${REPOSITORY_OWNER:-eapolancovelmar}/msp-helpdesk-server:${VERSION:-latest}
    container_name: msp_server_prod
    restart: always
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-msp_helpdesk}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - UPLOAD_DIR=/app/server/uploads
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_APP_USER=${NEXTCLOUD_APP_USER}
      - NEXTCLOUD_APP_PASS=${NEXTCLOUD_APP_PASS}
      - NEXTCLOUD_TOTAL_CAPACITY=${NEXTCLOUD_TOTAL_CAPACITY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
      - ZABBIX_URL=${ZABBIX_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      - ZABBIX_USER=${ZABBIX_USER:-Admin}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD:-zabbix}
      - ZABBIX_WEBHOOK_SECRET=${ZABBIX_WEBHOOK_SECRET:-secret_key}
    volumes:
      - uploads_data:/app/server/uploads

  zabbix-db:
    image: postgres:16-alpine
    container_name: msp_zabbix_db_prod
    restart: always
    networks:
      - default
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_server_prod
    restart: always
    networks:
      - default
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_web_prod
    restart: always
    networks:
      - default
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      PHP_TZ: "America/Santo_Domingo"

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-6.0-latest
    container_name: msp_zabbix_agent_prod
    restart: always
    networks:
      - default
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: "Zabbix server"

  client:
    image: ghcr.io/${REPOSITORY_OWNER:-eapolancovelmar}/msp-helpdesk-client:${VERSION:-latest}
    container_name: msp_client_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-client.rule=Host(`helpdesk.velmartech.com.do`)"
      - "traefik.http.routers.msp-client.entrypoints=web"
      - "traefik.http.routers.msp-client.entrypoints=websecure"
      - "traefik.http.routers.msp-client.tls=true"
      # - "traefik.http.routers.msp-client.tls.certresolver=myresolver"
      - "traefik.http.services.msp-client-svc.loadbalancer.server.port=80"

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  zabbix_pgdata:
    driver: local

networks:
  default:
  reverse-proxy:
    external: true

