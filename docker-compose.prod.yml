version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: msp_postgres_db_prod
    restart: always
    networks:
      - default
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-msp_helpdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/${REPOSITORY_OWNER:-eapolancovelmar}/msp-helpdesk-server:latest
    container_name: msp_server_prod
    restart: always
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-msp_helpdesk}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - UPLOAD_DIR=/app/server/uploads
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_APP_USER=${NEXTCLOUD_APP_USER}
      - NEXTCLOUD_APP_PASS=${NEXTCLOUD_APP_PASS}
      - NEXTCLOUD_TOTAL_CAPACITY=${NEXTCLOUD_TOTAL_CAPACITY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
    volumes:
      - uploads_data:/app/server/uploads

  client:
    image: ghcr.io/${REPOSITORY_OWNER:-eapolancovelmar}/msp-helpdesk-client:latest
    container_name: msp_client_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-client.rule=Host(`helpdesk.velmartech.com.do`)"
      - "traefik.http.routers.msp-client.entrypoints=web"
      - "traefik.http.routers.msp-client.entrypoints=websecure"
      - "traefik.http.routers.msp-client.tls=true"
      # - "traefik.http.routers.msp-client.tls.certresolver=myresolver"
      - "traefik.http.services.msp-client-svc.loadbalancer.server.port=80"

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
  reverse-proxy:
    external: true
