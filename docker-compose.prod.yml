version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: msp_postgres_db_prod
    restart: always
    networks:
      - default
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-msp_helpdesk}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-msp_helpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 250M
        reservations:
          cpus: '0.05'
          memory: 64M

  redis:
    image: redis:7-alpine
    container_name: msp_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - default
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 16M

  server:
    image: ghcr.io/${REPOSITORY_OWNER:-velmar-technology}/msp-services-server:${VERSION:-latest}
    container_name: msp_server_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - TZ=${TZ:-America/Santo_Domingo}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-msp_helpdesk}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=3001
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - UPLOAD_DIR=/app/server/uploads
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_APP_USER=${NEXTCLOUD_APP_USER}
      - NEXTCLOUD_APP_PASS=${NEXTCLOUD_APP_PASS}
      - NEXTCLOUD_TOTAL_CAPACITY=${NEXTCLOUD_TOTAL_CAPACITY}
      - NEXTCLOUD_EXTERNAL_URL=${NEXTCLOUD_EXTERNAL_URL:-https://atlas.velmartech.com.do}
      - VAULTWARDEN_URL=${VAULTWARDEN_URL:-http://vaultwarden:80/vault}
      # REQUIRED — shared by msp_vaultwarden (ADMIN_TOKEN). Generate via: openssl rand -hex 32.
      # No fallback: an unset/empty value previously triggered a silent offline "simulation" in the backend.
      - VAULTWARDEN_ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?VAULTWARDEN_ADMIN_TOKEN is required}
      - VAULTWARDEN_EXTERNAL_URL=${VAULTWARDEN_EXTERNAL_URL:-https://helpdesk.velmartech.com.do/vault}
      - ZABBIX_URL=${ZABBIX_URL}
      - ZABBIX_USER=${ZABBIX_USER}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD}
      - ZABBIX_WEBHOOK_SECRET=${ZABBIX_WEBHOOK_SECRET}
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_SERVICE=${DD_SERVICE:-msp-services-server}
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${VERSION:-1.5.2}
      - DD_TRACE_ENABLED=${DD_TRACE_ENABLED:-false}
      - DD_AGENT_HOST=${DD_AGENT_HOST:-}
    volumes:
      - uploads_data:/app/server/uploads
      - vaultwarden_data:/vaultwarden_data:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 300M
        reservations:
          cpus: '0.05'
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-server.rule=Host(`helpdesk.velmartech.com.do`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/agent-ws`))"
      - "traefik.http.routers.msp-server.entrypoints=websecure"
      - "traefik.http.routers.msp-server.tls=true"
      - "traefik.http.routers.msp-server.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-server.priority=100"
      - "traefik.http.routers.msp-server.middlewares=msp-compress"
      - "traefik.http.services.msp-server-svc.loadbalancer.server.port=3001"

  zabbix-db:
    image: postgres:16-alpine
    container_name: msp_zabbix_db_prod
    restart: always
    networks:
      - default
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 380M
        reservations:
          cpus: '0.05'
          memory: 128M

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_server_prod
    restart: always
    ports:
      - "10051:10051"
    networks:
      - default
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 200M
        reservations:
          cpus: '0.05'
          memory: 64M

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    container_name: msp_zabbix_web_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      PHP_TZ: ${TZ:-America/Santo_Domingo}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 150M
        reservations:
          cpus: '0.02'
          memory: 48M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-zabbix.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/zabbix`)"
      - "traefik.http.routers.msp-zabbix.entrypoints=websecure"
      - "traefik.http.routers.msp-zabbix.tls=true"
      - "traefik.http.routers.msp-zabbix.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-zabbix.priority=100"
      - "traefik.http.middlewares.zabbix-auth.basicauth.users=${ZABBIX_BASIC_AUTH_USERS}"
      - "traefik.http.middlewares.msp-zabbix-redirect.redirectregex.regex=^(https?://[^/]+)/zabbix([?#].*)?$$"
      - "traefik.http.middlewares.msp-zabbix-redirect.redirectregex.replacement=$${1}/zabbix/$${2}"
      - "traefik.http.middlewares.msp-zabbix-strip.stripprefix.prefixes=/zabbix"
      - "traefik.http.routers.msp-zabbix.middlewares=msp-zabbix-redirect,zabbix-auth,msp-zabbix-strip"
      - "traefik.http.services.msp-zabbix-svc.loadbalancer.server.port=8080"

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-6.0-latest
    container_name: msp_zabbix_agent_prod
    restart: always
    network_mode: "service:zabbix-server"
    depends_on:
      - zabbix-server
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      ZBX_SERVER_HOST: "127.0.0.1,zabbix-server"
      ZBX_HOSTNAME: "Zabbix server"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 80M
        reservations:
          cpus: '0.01'
          memory: 24M

  client:
    image: ghcr.io/${REPOSITORY_OWNER:-velmar-technology}/msp-services-client:${VERSION:-latest}
    container_name: msp_client_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-client.rule=Host(`helpdesk.velmartech.com.do`)"
      - "traefik.http.routers.msp-client.entrypoints=websecure"
      - "traefik.http.routers.msp-client.tls=true"
      - "traefik.http.routers.msp-client.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-client.priority=1"
      - "traefik.http.middlewares.msp-compress.compress=true"
      - "traefik.http.routers.msp-client.middlewares=msp-compress"
      - "traefik.http.services.msp-client-svc.loadbalancer.server.port=80"

  logs:
    image: amir20/dozzle:latest
    container_name: msp_portal_logs
    environment:
      - TZ=${TZ:-America/Santo_Domingo}
      - DOZZLE_BASE=/logs
      - DOZZLE_FILTER=label=com.docker.compose.project=msp_portal
    networks:
      - default
      - reverse-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 80M
        reservations:
          cpus: '0.01'
          memory: 20M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-logs.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/logs`)"
      - "traefik.http.routers.msp-logs.entrypoints=websecure"
      - "traefik.http.routers.msp-logs.tls=true"
      - "traefik.http.routers.msp-logs.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-logs.priority=100"
      - "traefik.http.middlewares.logs-auth.basicauth.users=${LOGS_BASIC_AUTH_USERS}"
      - "traefik.http.routers.msp-logs.middlewares=logs-auth"
      - "traefik.http.services.msp-logs-svc.loadbalancer.server.port=8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: msp_prometheus
    restart: always
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']

          - job_name: 'traefik'
            static_configs:
              - targets: ['traefik:8080']

          - job_name: 'msp-server'
            metrics_path: '/api/v1/metrics'
            static_configs:
              - targets: ['server:3001']

          - job_name: 'alloy'
            static_configs:
              - targets: ['alloy:12345']
        EOF
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle --web.route-prefix=/prometheus --web.external-url=https://helpdesk.velmartech.com.do/prometheus
    volumes:
      - prometheus_data:/prometheus
    networks:
      - default
      - reverse-proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 150M
        reservations:
          cpus: '0.02'
          memory: 40M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-prometheus.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.msp-prometheus.entrypoints=websecure"
      - "traefik.http.routers.msp-prometheus.tls=true"
      - "traefik.http.routers.msp-prometheus.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-prometheus.priority=100"
      - "traefik.http.middlewares.prom-auth.basicauth.users=${PROM_BASIC_AUTH_USERS}"
      - "traefik.http.routers.msp-prometheus.middlewares=prom-auth"
      - "traefik.http.services.msp-prometheus-svc.loadbalancer.server.port=9090"

  alloy:
    image: grafana/alloy:v1.2.0
    container_name: msp_alloy
    restart: always
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/alloy/config.alloy
        faro.receiver "faro" {
          server {
            listen_address           = "0.0.0.0"
            listen_port              = 12347
            cors_allowed_origins     = ["https://helpdesk.velmartech.com.do", "*"]
            max_allowed_payload_size = "10MiB"
          }

          output {
          }
        }
        EOF
        exec /bin/alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
    networks:
      - default
      - reverse-proxy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 100M
        reservations:
          cpus: '0.01'
          memory: 30M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-faro.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/collect`)"
      - "traefik.http.routers.msp-faro.entrypoints=websecure"
      - "traefik.http.routers.msp-faro.tls=true"
      - "traefik.http.routers.msp-faro.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-faro.priority=100"
      - "traefik.http.services.msp-faro-svc.loadbalancer.server.port=12347"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: msp_grafana
    restart: always
    environment:
      - TZ=${TZ:-America/Santo_Domingo}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_EMAIL=${GRAFANA_ADMIN_EMAIL:-admin@velmartech.com.do}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_PASSWORD_RESET=false
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
      - GF_SERVER_ROOT_URL=https://helpdesk.velmartech.com.do/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT:-587}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_USER}
      - GF_SMTP_FROM_NAME=Velmartech MSP Monitoring
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - default
      - reverse-proxy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 180M
        reservations:
          cpus: '0.02'
          memory: 60M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-grafana.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.msp-grafana.entrypoints=websecure"
      - "traefik.http.routers.msp-grafana.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-grafana.priority=100"
      - "traefik.http.services.msp-grafana-svc.loadbalancer.server.port=3000"

  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: msp_vaultwarden
    restart: always
    environment:
      - DOMAIN=https://helpdesk.velmartech.com.do/vault
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      # Admin API key for Bitwarden server; must match server's VAULTWARDEN_ADMIN_TOKEN.
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?VAULTWARDEN_ADMIN_TOKEN is required}
      - WEBSOCKET_ENABLED=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_USER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - vaultwarden_data:/data
    networks:
      - default
      - reverse-proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 120M
        reservations:
          cpus: '0.02'
          memory: 30M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-vault.rule=Host(`helpdesk.velmartech.com.do`) && PathPrefix(`/vault`)"
      - "traefik.http.routers.msp-vault.entrypoints=websecure"
      - "traefik.http.routers.msp-vault.tls=true"
      - "traefik.http.routers.msp-vault.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-vault.priority=100"
      - "traefik.http.services.msp-vault-svc.loadbalancer.server.port=80"

  mcp-server:
    image: ghcr.io/${REPOSITORY_OWNER:-velmar-technology}/msp-mcp-server:${VERSION:-latest}
    container_name: msp_mcp_prod
    restart: always
    networks:
      - default
      - reverse-proxy
    depends_on:
      server:
        condition: service_healthy
    environment:
      - TZ=${TZ:-America/Santo_Domingo}
      - NODE_ENV=production
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3005
      - MSP_SERVER_URL=${MSP_SERVER_URL:-helpdesk.velmartech.com.do}
      - MSP_API_KEY=${MSP_API_KEY}
      - MCP_SERVER_API_KEY=${MCP_SERVER_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3005/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 120M
        reservations:
          cpus: '0.01'
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.msp-mcp.rule=Host(`helpdesk.velmartech.com.do`) && (PathPrefix(`/mcp`))"
      - "traefik.http.routers.msp-mcp.entrypoints=websecure"
      - "traefik.http.routers.msp-mcp.tls=true"
      - "traefik.http.routers.msp-mcp.tls.certresolver=myresolver"
      - "traefik.http.routers.msp-mcp.priority=100"
      - "traefik.http.services.msp-mcp-svc.loadbalancer.server.port=3005"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads_data:
    driver: local
  zabbix_pgdata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alloy_data:
    driver: local
  vaultwarden_data:
    driver: local

networks:
  default:
  reverse-proxy:
    external: true
