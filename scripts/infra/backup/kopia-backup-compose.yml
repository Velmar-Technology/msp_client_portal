version: '3.8'

services:
  kopia-backup:
    image: kopia/kopia:latest
    container_name: msp_kopia_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed -i 's/\\r$$//' /app/config/backup-scheduler.sh 2>/dev/null; exec /bin/sh /app/config/backup-scheduler.sh"]
    environment:
      - TZ=America/Santo_Domingo
      - KOPIA_PASSWORD=VelmarKopiaNextcloud2026!SecureBackup
      - KOPIA_REPOSITORY_PASSWORD=VelmarKopiaNextcloud2026!SecureBackup
      - KOPIA_SERVER_USERNAME=admin
      - KOPIA_SERVER_PASSWORD=VelmarKopia2026!SecureUI
      - KOPIA_CACHE_DIRECTORY=/app/cache
      - KOPIA_CONFIG_PATH=/app/config/repository.config
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gdrive-service-account.json
    volumes:
      # Nextcloud read-only mounts
      - /mnt/.ix-apps/app_mounts/nextcloud/data:/nextcloud_data:ro
      - /mnt/.ix-apps/app_mounts/nextcloud/html/config:/nextcloud_config:ro
      # Persistent Kopia internal state
      - /mnt/.ix-apps/app_mounts/kopia_cache:/app/cache
      - /mnt/.ix-apps/app_mounts/kopia_config:/app/config
      - /mnt/.ix-apps/app_mounts/kopia_staging:/staging
      # Host Docker socket for atomic occ and pg_dump orchestration
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "0.0.0.0:51515:51515"
    networks:
      - default
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      # Exempt static assets from Basic Auth to prevent multiple auth prompts
      - "traefik.http.routers.kopia-assets.entrypoints=websecure"
      - "traefik.http.routers.kopia-assets.rule=Host(`kopia.mitefree.net`) && PathPrefix(`/assets`)"
      - "traefik.http.routers.kopia-assets.tls=true"
      - "traefik.http.routers.kopia-assets.priority=150"
      - "traefik.http.routers.kopia-assets.service=kopia-svc"

      # Protect all views and API with Basic Auth
      - "traefik.http.routers.kopia-main.entrypoints=websecure"
      - "traefik.http.routers.kopia-main.rule=Host(`kopia.mitefree.net`)"
      - "traefik.http.routers.kopia-main.tls=true"
      - "traefik.http.routers.kopia-main.priority=100"
      - "traefik.http.routers.kopia-main.service=kopia-svc"
      - "traefik.http.routers.kopia-main.middlewares=kopia-auth"
      - "traefik.http.middlewares.kopia-auth.basicauth.users=admin:{SHA}srmtS9uPw/LN3yf6/8tv0gTRNOI="
      - "traefik.http.middlewares.kopia-auth.basicauth.realm=Kopia Admin Panel"

      # Service loadbalancer
      - "traefik.http.services.kopia-svc.loadbalancer.server.port=51515"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M

networks:
  default:
  reverse-proxy:
    external: true
